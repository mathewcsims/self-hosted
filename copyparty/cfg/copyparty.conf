# copyparty configuration. Any *.conf file in /cfg is loaded automatically.
# Docs: https://github.com/9001/copyparty#configuration-files
#
# Account passwords live in ./accounts.conf, NOT here — that file is
# gitignored (see accounts.conf.example for the template). copyparty doesn't
# support ${VAR} substitution in .conf files, so this is the equivalent: it
# auto-loads every *.conf file in /cfg, so a second file merges in cleanly
# with zero change to how the container runs.

[global]
  e2dsa            # build file index on startup (enables search, dedupe, etc.)
  e2ts             # index media tags (mp3/flac/jpg metadata) for search
  no-robots        # ask search engines not to crawl this server
  # Human-readable server name (top-left in the browser + mDNS) and browser-tab
  # title — replaces the random container hostname. Change to whatever you like.
  name: Mathew's Copyparty
  bname: Mathew's Copyparty //
  # Behind the Pi's Caddy reverse proxy. TLS is terminated at Caddy, and the
  # request reaches copyparty via podman's internal gateway (192.168.127.1).
  # We must explicitly trust that proxy, or copyparty ignores Caddy's
  # X-Forwarded-Proto: https header and rejects the HTTPS login with a CORS
  # error ("rejected by cors-check").
  xff-src: lan     # trust LAN/private reverse proxies (incl. the podman gateway)
  rproxy: -1       # take the real client IP from the closest proxy (safe with one proxy)
  # Tried --ipa 10.0.1.19/32 to restrict direct LAN access to just the Pi,
  # but it doesn't work in this topology: behind podman's published-port
  # NAT, copyparty only ever sees podman's internal gateway IP as the
  # connection source, never the real LAN IP — confirmed against
  # https://github.com/9001/copyparty/issues/1109. That blocked everyone
  # equally, including the Pi itself. The LAN-only restriction for this
  # port is instead enforced at the macOS firewall layer — see
  # ../SETUP.md's "Restricting LAN-only ports" section.
  # ── vague-403: REMOVED 2026-08-07. Do not re-add. ─────────────────────
  # This used to be `vague-403`, which sends 404 instead of 403 for denied
  # requests ("security through ambiguity" per copyparty's own --help), so an
  # unauthenticated visitor could not tell a private path apart from a
  # nonexistent one.
  #
  # copyparty's --help marks it "WARNING: Not compatible with WebDAV". That is
  # exact, and this is what it means in practice: it rewrites the 401 as well
  # as the 403, so a WebDAV client that waits to be CHALLENGED never
  # authenticates at all.
  #
  # It broke Orgzly Revived (okhttp/5.3.2) completely — the volume listed, but
  # every notebook failed with "Error contacting ... (404)". Caddy's access
  # log showed the mechanism outright:
  #     404  PROPFIND  auth=yes  ua=okhttp/5.3.2  /orgtasks/.orgzlyignore
  #     404  GET       auth=NO   ua=okhttp/5.3.2  /orgtasks/Work.org
  # Orgzly authenticates PROPFIND but sends GET unauthenticated first, expecting
  # 401 + WWW-Authenticate and retrying with credentials. vague-403 answered
  # 404, so the challenge never came and it gave up.
  #
  # WHY EARLIER TESTING MISSED IT, worth internalising: `curl -u` sends Basic
  # auth PREEMPTIVELY, and so does organice's `webdav` npm client. Both worked
  # perfectly while a challenge-based client was totally broken. When checking
  # auth on a WebDAV volume, assert that an UNAUTHENTICATED GET returns 401 —
  # not merely that an authenticated one returns 200.
  #
  # `dav-ua1: (kioworker|okhttp)/` was tried first as a narrower fix, to keep
  # vague-403 for everything else. IT DOES NOT WORK: vague-403 rewrites the
  # response regardless of dav-ua1 (verified, including bypassing Caddy). And
  # once vague-403 is gone dav-ua1 is redundant anyway — okhttp already gets a
  # 401, because it does not match --ua-nodav's browser regex (also verified).
  # So it was removed rather than left in as cargo cult.
  #
  # What removing vague-403 costs: a prober can now distinguish 403 from 404 on
  # cp.mathewcsims.uk. Small here — this instance's volume layout (/pub,
  # /inbox, /orgtasks) is already public in the tracked copyparty.conf of a
  # public repo, so there was little left to conceal. Authentication, not
  # ambiguity, is what protects the data.

  # ── CORS, for organice (https://org.mathewcsims.uk) ────────────────────
  # organice is a browser SPA on a DIFFERENT origin, so every WebDAV call it
  # makes is cross-origin and PROPFIND/PUT require a preflight.
  #
  # acao is deliberately a SINGLE named origin, not the default "*". Two
  # reasons, and both matter:
  #   1. copyparty's default "*" "removes cookies and http-auth; only
  #      ?pw=hunter2 survives" (its --help). organice sends HTTP Basic auth,
  #      so under "*" it would simply never authenticate.
  #   2. organice's own documentation tells you to set
  #      `Access-Control-Allow-Origin: *` together with
  #      `Access-Control-Allow-Credentials: true`. That pairing is INVALID
  #      per the CORS spec (browsers reject "*" when credentials are sent)
  #      and would be dangerous if it worked — any site you visited could
  #      make authenticated requests to this server. Do not follow it.
  # Naming one origin is therefore both more correct and TIGHTER than the
  # default it replaces.
  acao: https://org.mathewcsims.uk
  # Default is GET,HEAD — organice additionally needs PROPFIND (listing),
  # PUT (save), OPTIONS (preflight), and DELETE/POST for file management.
  acam: GET,HEAD,OPTIONS,PUT,DELETE,POST,PROPFIND
  # Brute-force login lockout: more than 9 wrong passwords in 60min bans that
  # source for 24h; more than 9 403s in 2min bans for 24h. These match
  # copyparty's own defaults exactly — stated explicitly rather than left as
  # an unwritten default, so this is reviewable here instead of only in
  # --help output.
  ban-pw: 9,60,1440
  ban-403: 9,2,1440
  # Share links: logged-in admin can create unguessable /share/<token> links for
  # any file/folder (incl. private ones), with optional expiry/password. The DB
  # lives in /cfg (persisted). shr-site makes generated links use the real domain.
  shr: /share
  shr-site: https://cp.mathewcsims.uk

[/]                # PRIVATE root (https://cp.mathewcsims.uk/) — admin only
  /w               # ...mapped to /w in the container == ./copyparty/data on disk
  accs:
    A: admin       # "A" = full access (read, write, move, delete, admin, dotfiles)
    # No anonymous access. Anonymous visitors hitting / are denied; only the
    # admin login can read or write here.

[/pub]             # PUBLIC area (https://cp.mathewcsims.uk/pub)
  /pub             # ...mapped to /pub == ./copyparty/public on disk
  accs:
    r: *           # anyone (not logged in) can view + download what's in here
    A: admin       # admin keeps full control (upload/move/delete/manage)
    # Put a file or folder in ./copyparty/public and it becomes visible to the
    # world, read-only. Nothing else is exposed. To publish another existing
    # folder later, add another [/somename] volume block pointing at it with
    # the same "r: *" + "A: admin" pattern.

[/orgtasks]        # ORG FILES over WebDAV (https://cp.mathewcsims.uk/orgtasks)
  /orgtasks        # ...mapped to /orgtasks == ./copyparty/orgtasks on disk
  accs:
    A: admin       # admin keeps full control, as on every other volume here.
    rwmd: orgtasks
                   # ^ THE ACCOUNT THE CLIENTS ACTUALLY USE — organice in the
                   # browser and Orgzly Revived on Android. Scoped to this
                   # volume and nothing else.
                   #
                   # NOTE the comment is on its own line, not trailing that
                   # value. **copyparty requires at least TWO spaces before a
                   # `#`**, otherwise the whole line becomes part of the config
                   # value — `rwmd: orgtasks # ...` with one space fails to
                   # parse, with a clear warning in the startup log. The
                   # heavily-padded inline comments elsewhere in this file are
                   # padded for exactly that reason, not for looks.
                   #
                   # Why not just use admin: that password would also unlock
                   # [/], [/pub], [/inbox] and Grady's Training, and this one
                   # is typed into a phone and a browser's local storage. A
                   # lost device should cost the org files, not everything.
                   #
                   # rwmd, not A: A is "rwmda." — this drops admin (uploader
                   # IPs, config-reload) and dotfiles (so copyparty's own
                   # .hist directory stays out of client listings). `d` is
                   # NOT optional despite looking like it: copyparty's --daw
                   # documentation states the delete permission must always
                   # be given, and overwrite-on-save depends on it.
                   #
                   # No anonymous, no inbox, no grady. This volume is
                   # deliberately its own rather than a folder under [/] so
                   # the WebDAV write flag below is scoped to just this data.
  flags:
    daw            # Full WebDAV write support, as a VOLFLAG so it applies HERE
                   # ONLY and not to [/] , [/pub] or [/inbox].
                   #
                   # Required, not optional. copyparty decides "is this a real
                   # WebDAV client?" partly from User-Agent, and --ua-nodav
                   # defaults to ^(Mozilla/|NetworkingExtension/|com\.apple\.WebKit)
                   # — organice runs IN A BROWSER, so its requests always carry a
                   # Mozilla/ UA and are classified as not-webdav. --daw exists
                   # for exactly that case ("enable full write support, even if
                   # client may not be webdav"), and organice uses the plain
                   # `webdav` npm client with Basic auth, sending no x-oc-mtime
                   # header (the alternative copyparty accepts).
                   #
                   # SIDE EFFECT, per copyparty's --help: PUT now OVERWRITES an
                   # existing file rather than inventing a new filename to avoid
                   # data loss. That is precisely what saving an org file needs
                   # — without it organice's writes would land at names it never
                   # asked for and it would never see its own edits again. It is
                   # also why this is a volflag: that overwrite behaviour must
                   # not leak into /inbox, where "never silently replace an
                   # upload" is the whole point of the volume.

[/inbox]           # DROP BOX (https://cp.mathewcsims.uk/inbox)
  /inbox           # ...mapped to /inbox == ./copyparty/inbox on disk
  accs:
    w: inbox       # WRITE-ONLY: the "inbox" login can upload but cannot list or
                   # download anything here — not others' files, not its own.
    A: admin       # only admin (you) can see and retrieve what's been dropped.
    # No "r" for anyone but admin, and no anonymous access, so a visitor must
    # know the inbox password to upload, and can never browse the contents.

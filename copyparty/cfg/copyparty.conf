# copyparty configuration. Any *.conf file in /cfg is loaded automatically.
# Docs: https://github.com/9001/copyparty#configuration-files
#
# Account passwords live in ./accounts.conf, NOT here — that file is
# gitignored (see accounts.conf.example for the template). copyparty doesn't
# support ${VAR} substitution in .conf files, so this is the equivalent: it
# auto-loads every *.conf file in /cfg, so a second file merges in cleanly
# with zero change to how the container runs.

[global]
  e2dsa            # build file index on startup (enables search, dedupe, etc.)
  e2ts             # index media tags (mp3/flac/jpg metadata) for search
  no-robots        # ask search engines not to crawl this server
  # Human-readable server name (top-left in the browser + mDNS) and browser-tab
  # title — replaces the random container hostname. Change to whatever you like.
  name: Mathew's Copyparty
  bname: Mathew's Copyparty //
  # Behind the Pi's Caddy reverse proxy. TLS is terminated at Caddy, and the
  # request reaches copyparty via podman's internal gateway (192.168.127.1).
  # We must explicitly trust that proxy, or copyparty ignores Caddy's
  # X-Forwarded-Proto: https header and rejects the HTTPS login with a CORS
  # error ("rejected by cors-check").
  xff-src: lan     # trust LAN/private reverse proxies (incl. the podman gateway)
  rproxy: -1       # take the real client IP from the closest proxy (safe with one proxy)
  # Tried --ipa 10.0.1.19/32 to restrict direct LAN access to just the Pi,
  # but it doesn't work in this topology: behind podman's published-port
  # NAT, copyparty only ever sees podman's internal gateway IP as the
  # connection source, never the real LAN IP — confirmed against
  # https://github.com/9001/copyparty/issues/1109. That blocked everyone
  # equally, including the Pi itself. The LAN-only restriction for this
  # port is instead enforced at the macOS firewall layer — see
  # ../SETUP.md's "Restricting LAN-only ports" section.
  # Send 404 instead of 403 for denied requests ("security through ambiguity"
  # per copyparty's own --help). Without this, an unauthenticated visitor can
  # tell a private path exists (403) vs doesn't (404) just by probing it —
  # this makes both look identical.
  #
  # RESTORED 2026-08-08. It was removed on 07-08 because it breaks WebDAV
  # clients that wait to be challenged: it rewrites the 401 as well as the
  # 403, so Orgzly (okhttp) never authenticated. With organice and the
  # /orgtasks volume decommissioned, nothing here speaks WebDAV again, so the
  # incompatibility is moot and the ambiguity is free.
  #
  # A WebDAV volume WAS added back on 2026-08-08 (/sp-sync, below) and this
  # was deliberately KEPT. The instruction that used to sit here — "remove
  # this first" — assumed any WebDAV client waits to be challenged, which is
  # what broke Orgzly. Both halves were checked this time rather than
  # assumed:
  #
  #   * Super Productivity's WebDAV client sets `Authorization: Basic` on
  #     EVERY request (read in its source, not inferred), so it never depends
  #     on being challenged;
  #   * and an UNAUTHENTICATED PROPFIND against a vague-403 instance returns
  #     **401**, not 404 — measured in a throwaway container with this exact
  #     config, which is the assertion the old note demanded.
  #
  # If a CHALLENGE-BASED client is ever added, re-run that second test first:
  # an authenticated 200 proves nothing, because `curl -u` and every JS
  # client send Basic auth preemptively and pass regardless.
  vague-403

  # Brute-force login lockout: more than 9 wrong passwords in 60min bans that
  # source for 24h; more than 9 403s in 2min bans for 24h. These match
  # copyparty's own defaults exactly — stated explicitly rather than left as
  # an unwritten default, so this is reviewable here instead of only in
  # --help output.
  ban-pw: 9,60,1440
  ban-403: 9,2,1440
  # Share links: logged-in admin can create unguessable /share/<token> links for
  # any file/folder (incl. private ones), with optional expiry/password. The DB
  # lives in /cfg (persisted). shr-site makes generated links use the real domain.
  shr: /share
  shr-site: https://cp.mathewcsims.uk

[/]                # PRIVATE root (https://cp.mathewcsims.uk/) — admin only
  /w               # ...mapped to /w in the container == ./copyparty/data on disk
  accs:
    A: admin       # "A" = full access (read, write, move, delete, admin, dotfiles)
    # No anonymous access. Anonymous visitors hitting / are denied; only the
    # admin login can read or write here.

[/pub]             # PUBLIC area (https://cp.mathewcsims.uk/pub)
  /pub             # ...mapped to /pub == ./copyparty/public on disk
  accs:
    r: *           # anyone (not logged in) can view + download what's in here
    A: admin       # admin keeps full control (upload/move/delete/manage)
    # Put a file or folder in ./copyparty/public and it becomes visible to the
    # world, read-only. Nothing else is exposed. To publish another existing
    # folder later, add another [/somename] volume block pointing at it with
    # the same "r: *" + "A: admin" pattern.

[/inbox]           # DROP BOX (https://cp.mathewcsims.uk/inbox)
  /inbox           # ...mapped to /inbox == ./copyparty/inbox on disk
  accs:
    w: inbox       # WRITE-ONLY: the "inbox" login can upload but cannot list or
                   # download anything here — not others' files, not its own.
    A: admin       # only admin (you) can see and retrieve what's been dropped.
    # No "r" for anyone but admin, and no anonymous access, so a visitor must
    # know the inbox password to upload, and can never browse the contents.

# ── Super Productivity's WebDAV sync target ────────────────────────────────
# Holds nothing but Super Productivity's sync blob. The app is at
# https://sp.mathewcsims.uk and reaches this volume at
# https://sp.mathewcsims.uk/sp-sync/ — the SAME ORIGIN, via a Caddy route
# that proxies that path here without rewriting it. That is deliberate:
# Super Productivity syncs from the BROWSER, so a cross-origin target would
# need CORS, and copyparty only exposes --acao/--acam with no control over
# Access-Control-Allow-Headers. SP sends Depth and If-Match, which are not
# CORS-safelisted, so preflight would fail. Same-origin removes the problem
# rather than configuring around it. The path must NOT be rewritten, because
# copyparty puts its own paths in PROPFIND <D:href> and the client resolves
# against them.
#
# The "spsync" account is defined in accounts-spsync.conf, rendered from its
# own Proton Pass item ("Copyparty SP Sync"). It is separate from
# accounts.conf because the agent's Pass token cannot UPDATE items, only
# create them — copyparty merges [accounts] across auto-loaded *.conf files,
# verified in a throwaway container before relying on it.
[/sp-sync]
  /sp-sync
  accs:
    rwmd: spsync
    # Read, write, move, delete — all four are required. Delete is not
    # optional decoration: copyparty mandates the delete-permission whenever
    # "daw" is set, and Super Productivity issues real DELETEs.
    A: admin
    # Admin keeps full access so the sync blob is reachable and restorable
    # from the normal copyparty UI without the scoped account.
  flags:
    daw
    # VOLFLAG, NOT GLOBAL — this is the important part. Without "daw",
    # copyparty answers a PUT over an existing file by inventing a new
    # filename rather than overwriting, which for a sync client means every
    # save silently becomes a new file and sync never converges. Set
    # globally it would change overwrite semantics for the ENTIRE file
    # server, including your actual documents; copyparty's own help says to
    # prefer the volflag, and it is scoped to this volume alone.
    #
    # Needed here specifically because Super Productivity does not send the
    # 'x-oc-mtime' header that would otherwise make it unnecessary —
    # confirmed by reading its WebDAV client, which sends only GET, PUT,
    # DELETE, PROPFIND and MKCOL.

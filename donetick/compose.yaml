# Donetick (https://donetick.com) — task and chore manager. Re-added
# 2026-08-01, replacing a short-lived Tududi trial.
#
# ── WHY DONETICK, AND WHY IT CAME BACK ────────────────────────────────────
# Donetick ran here once before (096132c, 3 July 2026) and was removed 34
# minutes later (f0bfc1d) — NOT for anything to do with task management.
# Avatar uploads needed S3-compatible storage; MinIO turned out to be
# effectively unmaintained, the Garage replacement needed config that
# couldn't be verified against the pinned release, and the whole app was
# dropped rather than keep debugging a storage stack for one cosmetic
# feature. Upstream has since added a plain filesystem backend
# (`storage_type: local`), so that entire reason is gone — see the storage
# settings below.
#
# Between then and now, Vikunja and then Tududi held this role, and both
# failed on capability:
#
#   * VIKUNJA cannot express anything beyond a fixed interval. Its repeat
#     modes are exactly three — every N seconds, monthly, or from the
#     completion date (pkg/models/tasks.go). "Wednesdays and Sundays" is
#     inexpressible, which is why phoning Mum had to be TWO tasks. Its UI
#     is also, in Mathew's words, "about as user friendly as a 2004 Linux
#     distro". Still running as the source of truth until this beds in.
#
#   * TUDUDI (trialled 2026-08-01, binned the same day) is fundamentally
#     flawed for real task management: it has NO time-of-day reminders at
#     all. `reminder_at` exists as a database column but nothing writes to
#     it — the API accepts it and silently discards it, and the UI never
#     exposes it. It notifies only that something is "due today" or
#     "overdue". It also caps subtasks at ONE level. A task manager that
#     cannot tell you to ring someone at 18:00, and cannot repeat that on
#     each occurrence, is not a task manager.
#
# Donetick does all of it, verified in source rather than from docs:
#   * 11 frequency types including `days_of_the_week` — Wed+Sun is ONE task
#   * up to 5 notification templates per chore, each an offset from that
#     occurrence's due date-and-time, regenerated every cycle
#     (internal/notifier/service/planner.go)
#   * projects, and subtasks that nest arbitrarily (SubTask.ParentId points
#     at another subtask, with no depth cap anywhere in the code)
#   * one-off tasks too (`once` / `no_repeat` frequency types)
#
# ── KNOWN RISK, ACCEPTED ──────────────────────────────────────────────────
# Young and effectively single-maintainer: first commit June 2024 (~2.1
# years), meauxt has 481 commits against the next contributor's 36. AGPL-3.0,
# so patchable if needed. Weighed against Vikunja's 8 years — but Vikunja
# cannot do the job.
#
# ── RUNS ON slartibartfast, NOT THE MAC ───────────────────────────────────
# The original 2026-07 deployment was on the Mac. This one isn't: Mac apps
# depend on podman-machine, which starts at GUI login (hence the 2-minute
# podman-watchdog). For something reached from a phone at arbitrary hours,
# "is the Mac awake and logged in?" is a real availability tax. slartibartfast
# is headless, always-on, and this is a single Go binary + SQLite.
#
# Third-host pattern, same as Immich: no `pi-shared` network across hosts, so
# it publishes a port and Caddy reaches it via {$SLARTI_IP}.
#
# Deploy (two steps, from the Mac):
#   scp -r donetick mathewcsims@100.68.10.65:~/donetick
#   ./scripts/pass-deploy-remote.sh donetick mathewcsims@100.68.10.65 '~/donetick'
#
# All config is via DT_* env vars — Donetick is a Go/Viper app, so every
# config key has a DT_<UPPER_SNAKE_DOTTED_PATH> equivalent. Verified against
# config/selfhosted.yaml and config/config.go AT THE PINNED TAG, not main.
name: donetick

services:
  donetick:
    # Pinned by DIGEST to the v0.1.76 multi-arch manifest (2026-07-26), the
    # latest STABLE release — deliberately not v0.1.77-beta.1, and not the
    # `latest` tag.
    #
    # Security review: GitHub's advisory database lists exactly one advisory
    # for this project — CVE-2025-47945 (CVSS 9.1, critical): a predictable
    # DEFAULT JWT signing secret allowing full account takeover, patched in
    # v0.1.44. Long fixed here, but the underlying lesson stands, which is
    # why DT_JWT_SECRET below is a freshly generated 64-byte random value
    # from Pass and never the config template's placeholder.
    image: docker.io/donetick/donetick@sha256:2f32646ef4e613f44066163646f53c02d6d5b728b31abe47dfd111b3dfd53643
    container_name: donetick
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: Europe/London

      DT_JWT_SECRET: ${DT_JWT_SECRET}
      DT_DATABASE_TYPE: sqlite
      DT_SERVER_PORT: "2021"

      # DT_SQLITE_PATH IS LOAD-BEARING — WITHOUT IT YOUR DATA IS EPHEMERAL.
      # This is NOT one of the DT_<CONFIG_KEY> Viper variables: the SQLite
      # path is read directly with os.Getenv (internal/database/database.go)
      # and defaults to a RELATIVE "donetick.db", which resolves to
      # /donetick.db in the container root — outside the volume below, and
      # destroyed on `docker compose down`.
      #
      # Confirmed live on first deploy: the app came up healthy, reported
      # itself fine, and the bind mount was completely empty while the real
      # database sat at /donetick.db inside the container. Mounting a volume
      # at /donetick-data does NOT by itself put anything in it. The original
      # 2026-07 deployment (096132c) had this same gap and never noticed,
      # because it was removed 34 minutes later.
      DT_SQLITE_PATH: /donetick-data/donetick.db

      # Correct link generation behind the reverse proxy (password resets,
      # share links) — same class of setting as MEMOS_INSTANCE_URL.
      DT_SERVER_PUBLIC_HOST: https://donetick.mathewcsims.uk
      DT_EMAIL_APP_HOST: https://donetick.mathewcsims.uk
      # No SMTP configured. Without it, password-reset URLs go to the
      # container's stdout instead of an inbox — `docker logs donetick` to
      # retrieve one. Notifications reach ntfy via webhook instead (below).
      DT_EMAIL_LOG_RAW_URL: "true"

      # CORS is enforced by the APP, not just Caddy — the real public origin
      # MUST be listed or the web UI breaks. The localhost/capacitor entries
      # are upstream's documented requirement for the mobile apps; harmless,
      # since no cookie or bearer token is ever attached to a request whose
      # Origin isn't one of these.
      DT_SERVER_CORS_ALLOW_ORIGINS: https://donetick.mathewcsims.uk,https://localhost,http://localhost,capacitor://localhost
      # The image's own default for the realtime/SSE endpoint is a bare "*"
      # (any origin). Scoped to the real domain — nothing here needs
      # cross-origin realtime access.
      DT_REALTIME_ALLOWED_ORIGINS: https://donetick.mathewcsims.uk

      # CLOSED, and a deliberate change from the previous deployment.
      # eecb9cb left registration open so the instance could be shared with
      # family later, mirroring Memos. This instance is public and closed by
      # default instead; open it consciously if you want to share it, rather
      # than leaving an open signup form on the internet indefinitely.
      # There is no CLI/env way to seed the first account, so the deploy
      # script opens it briefly, creates the one account from Pass, and
      # closes it again — see scripts/bootstrap-donetick-account.sh.
      DT_IS_USER_CREATION_DISABLED: "true"

      # Local filesystem storage — THE reason this app is viable again.
      # No S3, no MinIO, no Garage. base_path sits inside the bind mount
      # below so uploads are backed up with everything else.
      DT_STORAGE_STORAGE_TYPE: local
      DT_STORAGE_BASE_PATH: /donetick-data/uploads

      # Notification scheduler cadence (upstream defaults shown for clarity).
      # due_job is what fires a chore's reminder templates, so it bounds how
      # precise a "remind me at 18:00" can be — 30m is upstream's default and
      # too coarse for that. 5m keeps reminders close to their intended time
      # at negligible cost for a single-user instance.
      DT_SCHEDULER_JOBS_DUE_JOB: 5m
      DT_SCHEDULER_JOBS_OVERDUE_JOB: 3h
      DT_SCHEDULER_JOBS_PRE_DUE_JOB: 3h

      # The app's own rate limit is per-CLIENT, and Donetick has no
      # trusted-proxy / X-Forwarded-For handling (confirmed absent from its
      # config schema) — so behind Caddy it sees one client, "the proxy",
      # not distinct users. Real per-IP enforcement is at the Caddy layer
      # (see ../pi-reverse-proxy/Caddyfile). This stays as a loose backstop.
      DT_SERVER_RATE_LIMIT: "300"
      DT_SERVER_RATE_PERIOD: 60s
    volumes:
      - ./data:/donetick-data
    ports:
      # LAN IP only, never 0.0.0.0 — Caddy on the Pi is the only thing that
      # should reach it. The router does not forward 2021.
      - "10.0.1.11:2021:2021"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2021/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Go + SQLite: genuinely small. This bounds a runaway without starving
    # Immich's ML container, which is the real memory consumer on this host.
    mem_limit: 256m
    pids_limit: 64

# Tududi (https://tududi.com) — self-hosted task manager, added 2026-08-01.
# Replaces Vikunja for day-to-day task management (Vikunja stays running for
# now; see SETUP.md for the migration posture).
#
# ── WHY THIS, OVER VIKUNJA ────────────────────────────────────────────────
# Vikunja works and has run for eight years, but its UI is cluttered enough
# to actively discourage use, and its recurring-task handling is awkward:
# marking a repeating task done immediately re-dates and un-dones it, there
# is no "skip this occurrence", and reminders don't recur with the task.
# (Vikunja DOES have a `From current date` repeat mode — the gap is smaller
# than it first appears, but the UI problem isn't fixable by configuration.)
#
# Tududi is list-first and GTD-shaped (tasks → projects → areas), which maps
# onto the two distinct kinds of work here: recurring "chore" tasks, and
# one-off specific tasks. Recurrence supports completion-based repetition,
# so a task finished late still schedules the next one from when it was
# actually done — the specific behaviour Vikunja lacks.
#
# ── EYES OPEN ON THE MAIN RISK ────────────────────────────────────────────
# This is a YOUNG, SINGLE-MAINTAINER project: first commit November 2023
# (~2.7 years), and chrisvel has 923 commits against the next contributor's
# 23. 91 releases and a 10-issue tracker against 3.2k stars say it is well
# looked after TODAY, but it has not yet survived its author losing
# interest. Deployed deliberately, accepting that fixing problems here may
# mean patching the code rather than filing an issue and waiting. MIT
# licensed, which makes that legally straightforward.
#
# The exit path is unusually good, and is part of why this risk is
# acceptable: Tududi speaks CalDAV (see below), so the data is reachable by
# standard clients and portable to any other CalDAV-capable system.
#
# ── WHY slartibartfast, NOT THE PI ────────────────────────────────────────
# The Pi is the conventional home for small SQLite apps here, but its disk
# is at 82% (5.1 GB free) and this is a Node application — a heavier image
# than the Go/Rust services the Pi hosts. slartibartfast has 170 GB free and
# sits at 0.00 load with Immich idle, so it takes this comfortably.
#
# Same third-host pattern as Immich: no `pi-shared` network across hosts, so
# it publishes a port and Caddy reaches it by IP via {$SLARTI_IP}.
#
# Deploy (two steps, from the Mac):
#   scp -r tududi mathewcsims@100.68.10.65:~/tududi
#   ./scripts/pass-deploy-remote.sh tududi mathewcsims@100.68.10.65 '~/tududi'
#
# ── SECURITY REVIEW BEFORE DEPLOYING ──────────────────────────────────────
# This is PUBLICLY reachable (not LAN-gated) — deliberately, because the
# whole point is using it from Windows and Android away from home, and
# because Vikunja is already public on the same terms. So the auth posture
# was checked rather than assumed:
#   * Self-registration is DISABLED BY DEFAULT and admin-controlled
#     (docs/08-user-management.md). The first user to exist becomes admin —
#     which is TUDUDI_USER_EMAIL below, created at first boot. Nobody can
#     sign themselves up. Verify this in the admin panel after deploying.
#   * Sessions are signed with TUDUDI_SESSION_SECRET (64 random bytes,
#     generated into Pass — never a default).
#   * The app ships express-rate-limit on auth routes; Caddy adds its own
#     rate limiting in front regardless (same belt-and-braces as Memos,
#     Karakeep and msims.link, all of which had thin app-level protection).
#   * TUDUDI_TRUST_PROXY is REQUIRED behind Caddy — without it Express reads
#     the proxy's IP as the client IP, which both breaks rate limiting and
#     makes it log validation errors. Upstream documents this explicitly.
#
# ── CalDAV, THE REASON CROSS-PLATFORM WORKS ───────────────────────────────
# Tududi implements bidirectional CalDAV sync with full RRULE (RFC 5545)
# recurrence — so tasks are reachable from tasks.org on Android, Apple
# Reminders on iOS/macOS, and Thunderbird on the desktop (already running
# here for work mail), on top of the web UI which covers Windows and
# everything else. That is what makes this a genuine cross-platform answer
# rather than a web app with a phone-shaped compromise.
# Not configured in this commit — get the core app bedded in first.
#
# Secrets (TUDUDI_SESSION_SECRET, TUDUDI_USER_EMAIL, TUDUDI_USER_PASSWORD)
# come from the "Tududi" Proton Pass item via scripts/pass-deploy-remote.sh
# — created by scripts/pass-create-tududi-secrets.sh (run under your own
# pass-cli session, not the agent's — see that script's header for why).
name: tududi

services:
  tududi:
    # Pinned by DIGEST to the 1.3.1 multi-arch manifest (2026-07-28).
    # NOTE: GitHub's "latest release" is v1.2.4 — the Docker tags run ahead
    # of the GitHub releases page, so don't take that as the current
    # version. 1.4.0-rc.1 exists; deliberately staying on the newest
    # STABLE tag rather than a release candidate.
    image: chrisvel/tududi@sha256:8b57eaba3e97ea17ae6a26b061d28d1c46707ca1a46a767b8f5d55edca412b20
    container_name: tududi
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # msims-link drops ALL and adds nothing back, but that image runs as a
    # static binary with no startup work. This one CANNOT: its entrypoint
    # chowns /app to PUID:PGID and then drops privileges to that user, so a
    # bare `cap_drop: ALL` makes every chown fail with "Operation not
    # permitted" and the container crash-loops. Confirmed live on first
    # deploy — the same trap immich/compose.yaml already documents for its
    # Postgres.
    #
    # So: drop everything, then add back the four capabilities that
    # startup genuinely needs and nothing more. Notably NOT NET_RAW,
    # NET_ADMIN, SYS_ADMIN or anything else in the default docker set.
    # `no-new-privileges` still applies, which is what stops a setuid
    # binary inside the container escalating later.
    cap_add:
      - CHOWN        # entrypoint chowns /app and the data dirs to PUID:PGID
      - DAC_OVERRIDE # read/write those paths while still root, pre-drop
      - FOWNER       # operate on files it doesn't own yet
      - SETGID       # drop to PGID
      - SETUID       # drop to PUID
    environment:
      TZ: Europe/London
      # First-boot admin account. Tududi makes the first user an admin
      # automatically; since registration is closed, this is the only way
      # an account exists at all.
      TUDUDI_USER_EMAIL: ${TUDUDI_USER_EMAIL}
      TUDUDI_USER_PASSWORD: ${TUDUDI_USER_PASSWORD}
      TUDUDI_SESSION_SECRET: ${TUDUDI_SESSION_SECRET}
      # CORS allow-list. Must be the PUBLIC origin, not localhost — the
      # browser sends the origin it actually loaded, which is always
      # https://tududi.mathewcsims.uk here since Caddy is the only way in.
      TUDUDI_ALLOWED_ORIGINS: https://tududi.mathewcsims.uk
      # Load-bearing behind Caddy — see the security note above.
      TUDUDI_TRUST_PROXY: "true"
      TUDUDI_UPLOAD_PATH: /app/uploads
      # Match the host user so bind-mounted data isn't root-owned; this is
      # what lets the unprivileged kopia backup on this box read it.
      PUID: "1000"
      PGID: "1000"
    volumes:
      # MOUNT PATHS ARE VERSION-SENSITIVE. v1.2.0 moved these from
      # /app/backend/db and /app/backend/uploads to /app/db and
      # /app/uploads. Using the OLD paths on a NEW image silently writes to
      # an anonymous docker volume that is DISCARDED on container
      # recreation — i.e. total data loss that looks like it's working.
      # These are the correct paths for 1.2.x and later.
      - ./data/db:/app/db
      - ./data/uploads:/app/uploads
    # Published on the LAN IP only, not 0.0.0.0 — Caddy on the Pi is the
    # only thing that should reach it. Same shape as Immich's binding.
    ports:
      - "10.0.1.11:3002:3002"
    healthcheck:
      # The image is Node-based and has a shell, unlike msims-link's 6MB
      # scratch image — so a real container-level healthcheck is possible.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Node's baseline is heavier than the Go/Rust services on the Pi, but
    # this is a single-user task app, not a workload. 512m leaves plenty of
    # room and still bounds a runaway. Immich's ML container is the thing
    # that actually needs headroom on this box.
    mem_limit: 512m
    pids_limit: 128

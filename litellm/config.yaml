# LiteLLM model routing. Mounted read-only at /app/config.yaml.
#
# Credentials are deliberately NOT in here. Authentication is Application
# Default Credentials, picked up from GOOGLE_APPLICATION_CREDENTIALS (set in
# compose.yaml, pointing at the read-only gcloud mount). This file carries no
# secrets and is safe to keep in the repo.
#
# ── NAMING ────────────────────────────────────────────────────────────────
# The product is **Gemini Enterprise Agent Platform** — Google renamed it
# from "Vertex AI" on 2026-04-22. The `vertex_ai/` prefixes below are NOT
# prose: they are LiteLLM's literal provider identifier, as are the
# VERTEXAI_* env vars and the aiplatform.googleapis.com host. Renaming any of
# those breaks the integration.
#
# ── WHAT THIS PROJECT ACTUALLY HAS — probed, not assumed (2026-08-02) ─────
# The publisher-model LIST endpoints are unavailable to this credential (they
# require a quota project, which the ADC account cannot set), so availability
# was established by probing 31 model IDs across 6 regions with real calls.
# Result: 9 available, all Google. There is **no Anthropic, Meta, Mistral or
# Imagen access** on this project — every one returned 404 in every region.
#
#   model                     available in
#   gemini-2.5-flash          ALL 6 regions incl. europe-west2
#   gemini-2.5-pro            eu-west1/4/9, us-central1, global  (NOT west2)
#   gemini-2.5-flash-lite     eu-west1/4/9, us-central1, global  (NOT west2)
#   gemini-2.5-flash-image    eu-west1/4, us-central1, global    (NOT west2)
#   gemini-3-flash-preview    global ONLY
#   text-embedding-005        ALL 6 regions
#   text-embedding-004        ALL 6 regions
#   text-multilingual-embedding-002  ALL 6 regions
#   gemini-embedding-001      ALL 6 regions
#
# Not available anywhere: all Claude, Llama, Mistral and Imagen models, plus
# gemini-3-pro, gemini-3-flash (non-preview), gemini-2.0-*, gemini-1.5-*.
#
# ── DATA RESIDENCY: read before using the wider models ───────────────────
# `vertex_location` is set explicitly per model so the region each request
# goes to is visible here rather than inherited silently:
#
#   europe-west2  London      — UK. The project's default and most restrictive.
#   europe-west1  Belgium     — EU, not UK.
#   global        worldwide   — may be served from ANY region, including
#                               outside the EU/UK.
#
# UK-resident models are listed first and given the plainest names. The
# wider-region ones are named so the trade-off is visible at the point of
# use — you cannot pick `gemini-pro` without seeing it is `-eu`.

model_list:
  # ── UK (europe-west2) — data stays in London ───────────────────────────
  - model_name: gemini-flash
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_location: europe-west2

  - model_name: text-embedding
    litellm_params:
      model: vertex_ai/text-embedding-005
      vertex_location: europe-west2

  - model_name: text-embedding-multilingual
    litellm_params:
      model: vertex_ai/text-multilingual-embedding-002
      vertex_location: europe-west2

  - model_name: gemini-embedding
    litellm_params:
      model: vertex_ai/gemini-embedding-001
      vertex_location: europe-west2

  - model_name: text-embedding-004
    litellm_params:
      model: vertex_ai/text-embedding-004
      vertex_location: europe-west2

  # ── EU (europe-west1, Belgium) — not available in London ───────────────
  - model_name: gemini-pro-eu
    litellm_params:
      model: vertex_ai/gemini-2.5-pro
      vertex_location: europe-west1

  - model_name: gemini-flash-lite-eu
    litellm_params:
      model: vertex_ai/gemini-2.5-flash-lite
      vertex_location: europe-west1

  # Image-capable (generates images as well as text).
  - model_name: gemini-flash-image-eu
    litellm_params:
      model: vertex_ai/gemini-2.5-flash-image
      vertex_location: europe-west1

  # ── GLOBAL — may be served from anywhere in the world ──────────────────
  # Only model on this project not available in any EU region. Preview, so
  # expect it to change or disappear without notice.
  - model_name: gemini-3-flash-preview-global
    litellm_params:
      model: vertex_ai/gemini-3-flash-preview
      vertex_location: global

general_settings:
  # Every request needs a virtual key. Without this the proxy would accept
  # unauthenticated calls from anything that reaches the port.
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  # Silently drop provider-unsupported params rather than erroring, so a
  # generic OpenAI client sending e.g. `frequency_penalty` still works.
  drop_params: true

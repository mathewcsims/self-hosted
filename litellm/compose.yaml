# LiteLLM — self-hosted AI gateway (https://github.com/BerriAI/litellm).
# Added 2026-07-30. One OpenAI-compatible endpoint in front of every AI
# provider this stack uses, so no app ever holds a real provider
# credential: apps get per-app "virtual keys" minted by LiteLLM, scoped to
# just the model(s) they need. First consumer: Marque's (Memos)
# speech-to-text transcription, backed by the org-provisioned Gemini
# Enterprise Agent Platform (GEAP) models — Memos only speaks "OpenAI
# endpoint + static API key", while GEAP only accepts short-lived OAuth2
# tokens minted from Application Default Credentials; this gateway is the
# translation layer between those two auth models. Personal providers
# (Claude/Mistral/Gemini AI Studio) can be added later as extra
# model_list entries + Pass fields, no structural change.
#
# ── Security review before deploying ──────────────────────────────────────
# LiteLLM's advisory history is extensive and recent — checked via
# GitHub's advisory database (ecosystem=pip, affects=litellm), not just
# release notes: multiple CRITICAL auth bypasses (host-header injection
# GHSA-4xpc-pv4p-pm3w, OIDC cache-key collision GHSA-jjhc-v7c2-5hh6), SQL
# injection in API-key verification (GHSA-r75f-5x8p-qvmc), privilege
# escalation via /user/update (GHSA-wpfp-gwwc-vwq6), and — worst — two
# published releases (1.82.7/1.82.8) that contained actual
# credential-harvesting malware (GHSA-5mg7-485q-xm76). Every published
# advisory is fixed by v1.84.0 at the latest; v1.94.0 (pinned below, by
# digest) post-dates them all. The malware incident is exactly why the
# digest pin matters here more than anywhere else in this repo: this one
# container holds every AI credential the stack has.
#
# Exposure: LAN-gated behind Caddy (litellm.mathewcsims.uk — see
# pi-reverse-proxy/Caddyfile), never internet-reachable. Defense in depth
# on top of the LAN gate: Caddy basic_auth on the dashboard UI paths, the
# general per-IP rate limit, and LiteLLM's own bearer auth (master key /
# virtual keys) on every API call.
#
# Secrets (LITELLM_MASTER_KEY, LITELLM_SALT_KEY, LITELLM_PG_PASSWORD,
# UI_USERNAME, UI_PASSWORD, GCP_CREDENTIALS_B64) come from the "LiteLLM"
# Proton Pass item via scripts/pass-deploy-litellm.sh — created by
# scripts/pass-create-litellm-secrets.sh (run under your own pass-cli
# session, not the agent's; agent PATs are read-only by design).
#
# LITELLM_SALT_KEY encrypts provider credentials stored in the DB and
# MUST NEVER change once set — same "fixed forever once real data exists"
# class as Wanderer's POCKETBASE_ENCRYPTION_KEY.
name: litellm

services:
  db:
    # Same postgres line as HealthLog's sidecar (16.x-alpine), pinned by
    # digest like every other image in this repo.
    image: docker.io/library/postgres:16.14-alpine@sha256:7ae1143a9f249af815f056751a122a86d7e44ddce0926f2b227e3d5c434444f4
    container_name: litellm-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_PG_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    # No published port — internal only, reached by the litellm service
    # over the compose network by container name.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m

  litellm:
    image: ghcr.io/berriai/litellm@sha256:9e2822d534546632b0678d47904d892cb3fd9332209a219720dec3af48895dff # v1.94.0
    container_name: litellm
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    command: ["--config", "/litellm_config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_PG_PASSWORD}@db:5432/litellm
      # Dashboard (/ui) login — LiteLLM's own, sitting BEHIND the Caddy
      # basic_auth layer on the same paths.
      UI_USERNAME: ${UI_USERNAME}
      UI_PASSWORD: ${UI_PASSWORD}
      # GEAP auth: Google's client libraries resolve Application Default
      # Credentials from this path. The file is written (0600, gitignored)
      # by scripts/pass-deploy-litellm.sh from the Pass item's
      # GCP_CREDENTIALS_B64 field at deploy time — it never exists in the
      # repo, only on disk at runtime.
      GOOGLE_APPLICATION_CREDENTIALS: /gcp-credentials.json
    volumes:
      - ./litellm_config.yaml:/litellm_config.yaml:ro
      - ./gcp-credentials.json:/gcp-credentials.json:ro
    ports:
      # Same podman-machine bind-to-LAN-IP quirk as every other Mac app.
      # Reached ONLY via Caddy (litellm.mathewcsims.uk) by consumers —
      # never by this raw IP:port (see the repo-wide no-hardcoded-IPs
      # rule; this line is a listen address, not a reference).
      - "10.0.1.14:4000:4000"
    healthcheck:
      # Image ships no curl/wget (confirmed by running it) — python only.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1g

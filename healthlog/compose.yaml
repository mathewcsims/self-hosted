# HealthLog — self-hosted health tracker (medication reminders, vitals,
# wellness signals). Added 2026-07-26 as a Pillo replacement. Personal
# health data, single user, public hostname — access control and data
# protection are the top priority for this one specifically (see
# pi-reverse-proxy/Caddyfile's HealthLog block for the deployment-time
# IP-allowlist used to close the "first registrant becomes admin" window,
# and SETUP.md for the full writeup).
#
# Upstream: https://github.com/MBombeck/HealthLog — PolyForm Noncommercial
# 1.0.0 licensed (source-available, not OSI open-source; free for this
# personal noncommercial self-hosted use). Reference compose:
# https://github.com/MBombeck/HealthLog/blob/main/docker-compose.yml
#
# Secrets (POSTGRES_PASSWORD, ENCRYPTION_KEY, API_TOKEN_HMAC_KEY) come from
# the "HealthLog" Proton Pass item via scripts/pass-deploy.sh — created by
# scripts/pass-create-healthlog-secrets.sh (run under your own pass-cli
# session, not the agent's — see that script's own header for why).
#
# Medication-reminder notification loop (fires every 15 min indefinitely,
# reported 2026-07-27, recurred 2026-07-28) — root cause CONFIRMED and
# FIXED upstream, resolved by updating the image:
#   The reminder tick's "already sent today" dedup used to be keyed off
#   the Telegram message ledger, which only gets a row when a Telegram
#   send succeeds. This deployment notifies via ntfy, not Telegram, so
#   that ledger never had a row for it — the dedup check always saw
#   "not yet sent" and the 15-minute tick re-fired forever, regardless
#   of whether the dose was later logged in-window. Confirmed via the
#   container's own structured logs (repeated `sendNotification` calls
#   at the same phase/slot every 15 min) and the upstream source
#   (src/lib/notifications/reminder-dedup.ts).
#   Fixed upstream in v1.33.1 (2026-07-27, commit c6b944b) — moved the
#   dedup anchor to the channel-agnostic `push_attempts` table. Our
#   image was pinned to `:latest` but hadn't been recreated since
#   2026-07-25 (podman doesn't auto-pull `:latest` on `compose up`), so
#   it was still running the old logic two days after the fix shipped.
#   Fixed by explicitly `podman pull`-ing and redeploying via
#   `./scripts/pass-deploy.sh healthlog HealthLog` (2026-07-28), now on
#   v1.33.2. Lesson: `:latest` here means "latest at the time the
#   container was last recreated", not "actually latest" — there's no
#   watchtower/auto-update on this app, so a real fix landing upstream
#   doesn't reach the running container until someone manually pulls.

name: healthlog

services:
  postgres:
    # 2026-08-02: was the last bare (undigested) tag in the repo — pinned to
    # close that gap, not to fix a CVE. 16.14-alpine carries 15 fixable
    # HIGH findings and they are NOT fixable here: every one is a Go stdlib
    # CVE in the image's helper binary, waiting on a rebuild with a newer
    # toolchain. Checked before pinning — 17-alpine has the same 15, and
    # 18-alpine 16, so a major-version upgrade fixes nothing and would be a
    # data migration for no benefit. The Debian variant is markedly worse
    # (17 unfixed CRITICAL, 38 unfixed HIGH), so alpine stays.
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: healthlog-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: healthlog
      POSTGRES_DB: healthlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthlog"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    pids_limit: 256

  web:
    # No dedicated release tag scheme documented beyond `:latest` in
    # upstream's own reference compose — pinned to a digest anyway, same
    # discipline as every other app here. Multi-arch (amd64+arm64), GHCR.
    # 2026-08-02: the comment above claimed this was digest-pinned while the
    # image line was still `:latest`. Actually pinned now.
    image: ghcr.io/mbombeck/healthlog@sha256:e9cf5d7219b205df6cb4346d3da8a63f5973a9b7f3ab187bacd8fd3663365a38
    container_name: healthlog
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # No TZ was ever set here, so the container ran on the image's own
      # baked-in default (Europe/Berlin, confirmed live via `date`/Node's
      # Intl.DateTimeFormat) — mismatched against Mathew's actual London
      # profile timezone (users.timezone, set in-app) by a full hour in
      # summer. The in-app profile timezone setting only affects the
      # database row — it can't reach into the container's own OS clock,
      # so this has to be set here explicitly. Worth fixing on its own
      # merits, but NOTE: this was originally found while chasing a
      # medication-reminder notification loop (2026-07-27) that turned
      # out to be unrelated — see the loop's real root cause and fix
      # below.
      TZ: Europe/London
      DATABASE_URL: postgresql://healthlog:${POSTGRES_PASSWORD}@postgres:5432/healthlog
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      API_TOKEN_HMAC_KEY: ${API_TOKEN_HMAC_KEY}

      # Must match the Caddy-fronted public hostname exactly — WebAuthn
      # passkeys are bound to this origin at registration time, and the
      # background job runner needs APP_URL for the same URLs server-side.
      NEXT_PUBLIC_APP_URL: https://healthlog.mathewcsims.uk
      APP_URL: https://healthlog.mathewcsims.uk

      # Real HTTPS throughout (Caddy terminates TLS on the Pi) — cookies
      # must be marked Secure, never relaxed for this app.
      SESSION_COOKIE_SECURE: "true"
    volumes:
      - ./data:/app/data
    ports:
      # Host port 3200, not 3000 — karakeep already has 3000. Same
      # podman-machine quirk as every other Mac app here: a published port
      # must be bound to the Mac's actual LAN IP, not 0.0.0.0. Never
      # directly internet-facing — the router doesn't forward 3200, and
      # the only path in is through Caddy on the Pi.
      - "10.0.1.14:3200:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    pids_limit: 256

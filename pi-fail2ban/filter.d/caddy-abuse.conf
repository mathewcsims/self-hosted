# Matches Caddy's JSON access log against unambiguous scanner/vuln-probe
# paths directly observed hitting this repo's Caddy (WordPress paths,
# dotfiles, phpMyAdmin, xmlrpc.php, SSH key paths; extended 2026-07-23
# after two live scanner incidents with webshell sprays / cPanel-Struts-
# Exchange sweeps).
# fail2ban auto-detects Caddy's numeric "ts" field as Epoch — verify with
# fail2ban-regex before enabling; add an explicit datepattern here if
# auto-detection ever fails on a future Caddy log-format change.
#
# DELIBERATE EXCLUSIONS — paths scanners do hit but that can be legitimate
# on this stack, so they must never auto-ban:
#   /config.json      — SPAs legitimately fetch this
#   /graphql          — a future app here could serve it for real
#   /.DS_Store        — copyparty serves user folders; Finder drops these
#                       in real shared folders
#   /autodiscover/*   — real Outlook/mail clients probe this for any
#                       domain a user types an email address for
#   root-level *.php  — copyparty serves user files at root paths; a
#                       legitimately shared .php file would ban the
#                       visitor downloading it
#
# Same false-positive rule for anything added later: only paths that can
# NEVER be served legitimately by any app behind this Caddy (remember
# copyparty exposes arbitrary user-named files/dirs).
#
# ── 2026-08-08 rework: precision up, ban volume down ─────────────────────
# The jail was producing ~67 bans/day, because maxretry=2 meant any IP that
# made two matching requests in five minutes was banned — which is nearly
# every drive-by scanner, most of which fire 2-4 probes and never return.
# Banning those has no protective effect (they were already finished, and
# nothing here serves PHP), but it drowned the notification channel.
#
# The fix is NOT to match less. Measured by replaying 34h of real access log
# (41.5k lines) through fail2ban's own counting semantics, matching less is
# what actually costs security: on the old root-level-only path list,
# raising maxretry to 5 cut bans to 3.5/day but caught only 5 of the 17
# genuine multi-probe sweeps in that window, against 15/17 today.
#
# So this widens WHAT counts and raises HOW MANY it takes:
#   * one optional leading path segment, so /blog/wp-login.php,
#     /wordpress/wp-includes/wlwmanifest.xml and /api/.env count too. The
#     old regex anchored the whole URI between the JSON quotes, so every
#     subdirectory variant was invisible — and scanners lean on them
#     heavily (66 of 429 matching requests in the sample window).
#   * with the jail then at maxretry=5/findtime=600 (see ../jail.local),
#     the measured result is 10.6 bans/day — an 84% cut — with sweep
#     coverage unchanged at 15/17. Real sweeps trip it faster than before;
#     single drive-by probes no longer trip it at all.
#
# TWO HOSTS ARE CARVED OUT, both required by the false-positive rule above:
#
#   cp.mathewcsims.uk (copyparty) is excluded from the PREFIXED form only.
#   It is public (no LAN gate — see ../../pi-reverse-proxy/Caddyfile) and
#   serves arbitrary user-named files and folders, so a shared folder
#   holding a .env, a config.php or a .git/ directory would ban the person
#   downloading it. Root-level probes against it are still caught, which is
#   the same coverage it had before this change.
#
#   mc37.mathewcsims.uk is the DrayTek router's own admin UI, and its
#   ENTIRE interface is built on /cgi-bin/*.cgi — logging in fires six of
#   them before you reach the dashboard (verified in the access log:
#   wlogin.cgi, cgidashboard.cgi, certificatedata.cgi, v2x00.cgi, sms.cgi,
#   variable.cgi). Today nothing bans it only because the LAN and tailnet
#   are in jail.local's ignoreip; the ignoreregex below means the router UI
#   stays usable even if that ever changes. This costs no coverage at all:
#   that vhost `abort`s every non-LAN client, so an internet scanner can
#   never get a served response there anyway.
#
# Path tails are [^"]* rather than .* so a pattern cannot run past the end
# of the JSON "uri" field into later fields on the same line, and a
# trailing (?:\?[^"]*)? makes query strings match on the fixed-path
# branches — /.env?x=1 and /xmlrpc.php?rsd previously slipped through.

[Definition]

# Scanner-only paths, shared by both failregex lines below.
_scanner_paths = /wp-login\.php|/wp-admin(?:/[^"]*)?|/wp-content/[^"]*|/wp-includes/[^"]*|/wordpress(?:/[^"]*)?|/wp-json(?:/[^"]*)?|/\.env|/\.git/[^"]*|/xmlrpc\.php|/phpmyadmin(?:/[^"]*)?|/\.aws/[^"]*|/\.ssh/[^"]*|/config\.php|/vendor/phpunit/[^"]*|/actuator/[^"]*|/cgi-bin/[^"]*|/\.well-known/\.\.[^"]*|/phpinfo\.php|/telescope/[^"]*|/_profiler/[^"]*|/ecp/[^"]*|/v2/_catalog|/login\.action|/___proxy_subdomain_[^"]*|/solr(?:/[^"]*)?|/manager/html|/boaform/[^"]*|/HNAP1[^"]*|/GponForm/[^"]*

# Exactly one leading directory segment — no slash inside, so this can only
# ever add one level (/blog/wp-login.php), never a deep path.
_prefix = /[\w.~-]{1,32}

# Line 1: root-level probes, every vhost. Line 2: the same list one
# directory deep, every vhost except copyparty.
failregex = ^.*"request":\{"remote_ip":"<HOST>".*"uri":"(?:%(_scanner_paths)s)(?:\?[^"]*)?"
            ^(?!.*"host":"cp\.mathewcsims\.uk").*"request":\{"remote_ip":"<HOST>".*"uri":"%(_prefix)s(?:%(_scanner_paths)s)(?:\?[^"]*)?"

# The router admin UI's own /cgi-bin/ endpoints — see the note above.
ignoreregex = ^.*"host":"mc37\.mathewcsims\.uk".*"uri":"/cgi-bin/

# Required CI — every job here is listed as a required status check in the
# "main protection" ruleset (Settings ▸ Rules ▸ Rulesets, also created via
# API — see SETUP.md's "Branch protection + required CI" section). Nothing
# lands on main, even from the repo owner, unless these pass on a PR.
#
# Action steps are pinned to full commit SHAs (with the tag as a comment),
# same reproducibility discipline as every container image digest in this
# repo — a tag on someone else's repo is mutable, a SHA is not.
#
# IMPORTANT: the ruleset references these jobs by their `name:`. Renaming a
# job here without updating the ruleset means PRs block forever waiting for
# a check that never reports.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Blocks any PR that introduces a dependency with a known vulnerability —
  # the PR-gating equivalent of Dependabot alerts (which only scan the
  # default branch after the fact). Reads the diff of the dependency graph,
  # so it catches new/changed deps in lockfiles across the whole repo.
  # Only meaningful on PRs (it diffs base..head), hence the condition.
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  # The repo's only JS build (owl/document-viewer): typecheck, build, and a
  # full `npm audit` against the lockfile. The audit line means a PR fails
  # if ANY dependency in the tree has a known advisory — including ones
  # published upstream since the last change. That is stricter than
  # dependency-review (which only inspects the PR's own dependency diff)
  # and is deliberate: it enforces "the tree is clean", not just "this PR
  # didn't make it worse".
  document-viewer:
    name: document-viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owl/document-viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: owl/document-viewer/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npx tsc --noEmit
      - run: npm run build

  # Validates the Pi's Caddyfile against the SAME custom-built image the Pi
  # actually runs (the stock caddy image lacks the rate_limit module and
  # rejects this config outright — hit live during the document-viewer
  # work). A syntax error here takes down every public hostname at once,
  # which makes this the single most dangerous file in the repo to break.
  caddyfile:
    name: caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the Pi's Caddy image (Dockerfile pins base by digest)
        run: docker build -t caddy-ci pi-reverse-proxy/
      - name: caddy validate
        # LITELLM_UI_HASH: basic_auth provisions its bcrypt hash at config
        # load, so validation needs SOME valid hash — this is a dummy
        # (hash of a throwaway string, generated for CI only); the real
        # one lives in the Pi's gitignored .env.
        run: |
          docker run --rm \
            -e ACME_EMAIL=ci@example.com \
            -e MAC_IP=10.0.1.14 \
            -e CP_DOMAIN=cp.example.com \
            -e 'LITELLM_UI_HASH=$2a$14$CTftQONlaXpsn271ZqlbS.wP6SMb5JOFTAQVuZdX6shGrGGXXxxyu' \
            -v "$PWD/pi-reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy-ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
